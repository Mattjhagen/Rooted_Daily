<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooted Daily | Your Bible Companion</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo-container">
                <img src="https://rootedapp.space/logo_dark_light.png" alt="Rooted Icon" class="logo-img">
                <span class="logo-text">Rooted Daily</span>
            </a>
            <nav>
                <a href="/bible/" class="nav-link">Bible Index</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Stay Rooted in the Word</h1>
            <p>Experience the Bible through high-quality audio narration, AI-powered reflections, and personal journaling.</p>
            
            <div class="button-grid">
                <!-- Web Reader Button (Primary CTA) -->
                <a href="/bible/" class="app-btn primary">
                    <span style="font-size: 1.5rem;">📖</span>
                    <div style="text-align: left;">
                        <span class="btn-text-small">Launch Now</span>
                        <span class="btn-text-large">Web Reader</span>
                    </div>
                </a>

                <!-- Google Play -->
                <a href="#" class="app-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" class="btn-icon">
                    <div style="text-align: left;">
                        <span class="btn-text-small">Get it on</span>
                        <span class="btn-text-large">Google Play</span>
                    </div>
                </a>
                
                <!-- App Store -->
                <a href="#" class="app-btn" style="opacity: 0.6; cursor: not-allowed;">
                    <span style="font-size: 1.5rem;">🍎</span>
                    <div style="text-align: left;">
                        <span class="btn-text-small">Coming Soon</span>
                        <span class="btn-text-large">App Store</span>
                    </div>
                </a>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 PacMac Mobile LLC. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
