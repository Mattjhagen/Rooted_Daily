<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooted Daily | Your Bible Companion</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo-container">
                <img src="https://rootedapp.space/logo_dark_light.png" alt="Rooted Icon" class="logo-img">
                <span class="logo-text">Rooted Daily</span>
            </a>
            <nav>
                <a href="/bible/" class="nav-link">Read Bible</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Stay Rooted in the Word</h1>
            <p>Experience the Bible through high-quality audio narration, AI-powered reflections, and personal journaling.</p>
            
            <div class="app-buttons" style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
                <div class="app-btn" style="background: #F4F1DE; color: #0C150E; padding: 1rem 2rem; border-radius: 16px; display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" style="height: 40px;">
                    <div style="text-align: left;">
                        <div style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; opacity: 0.7;">Get it on</div>
                        <div style="font-size: 1.2rem; font-weight: 700;">Google Play</div>
                    </div>
                </div>
                
                <div class="app-btn" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--color-text-secondary); padding: 1rem 2rem; border-radius: 16px; display: flex; align-items: center; gap: 1rem; opacity: 0.5;">
                    <div style="text-align: left;">
                        <div style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase;">Coming Soon to</div>
                        <div style="font-size: 1.2rem; font-weight: 700;">App Store</div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 4rem;">
                <a href="/bible/" class="nav-link" style="font-size: 1.1rem; text-decoration: underline; color: var(--color-accent);">Launch Web App Read Bible Online</a>
            </div>
        </section>

        <footer style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--color-border); color: var(--color-text-secondary); font-size: 0.85rem; text-align: center;">
            <p>&copy; 2026 PacMac Mobile LLC. All rights reserved.</p>
        </footer>
    </div>

    <script src="assets/js/bible-reader.js"></script>
</body>
</html>
