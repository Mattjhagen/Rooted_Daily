<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse the Bible | Rooted Daily</title>
    <meta name="description" content="Browse every book and chapter of the Bible. Read and listen to scripture with AI reflections and audio narration.">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        .bible-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            padding: 2rem 0;
        }
        .book-link {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 0.75rem;
            color: var(--color-text);
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }
        .book-link:hover {
            background: var(--color-accent);
            border-color: var(--color-text);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 1rem;">
                    <img src="../rooted-icon.png" alt="Rooted Icon" class="logo-img">
                    <span class="logo-text">Rooted Daily</span>
                </a>
            </div>
            <nav>
                <a href="/" class="nav-link">Home</a>
            </nav>
        </header>

        <section class="hero" style="padding: 4rem 0;">
            <h1>The Holy Bible</h1>
            <p>Select a book to start reading and listening.</p>
            
            <div class="bible-grid">
                <!-- Sample Books for SEO Crawl -->
                <a href="/bible/genesis/" class="book-link">Genesis</a>
                <a href="/bible/exodus/" class="book-link">Exodus</a>
                <a href="/bible/psalms/" class="book-link">Psalms</a>
                <a href="/bible/matthew/" class="book-link">Matthew</a>
                <a href="/bible/john/" class="book-link">John</a>
                <a href="/bible/romans/" class="book-link">Romans</a>
                <a href="/bible/revelation/" class="book-link">Revelation</a>
                <!-- ... other books would be added here ... -->
            </div>
        </section>

        <footer>
            <p>&copy; 2026 PacMac Mobile LLC. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
