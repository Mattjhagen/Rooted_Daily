    <style>
        .bible-content {
            max-width: 800px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
        }
        .verse {
            margin-bottom: 1rem;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .verse-num {
            font-weight: bold;
            color: var(--color-accent);
            margin-right: 0.5rem;
            font-size: 0.8rem;
            vertical-align: super;
        }
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }
        .nav-btn {
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-btn:hover {
            color: var(--color-text);
        }
        .bible-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .chapter-link {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.5rem;
            border-radius: 0.5rem;
            color: var(--color-text);
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }
        .chapter-link:hover {
            background: var(--color-accent);
        }
    </style>
</head>
